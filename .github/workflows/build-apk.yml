name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          which sdkmanager || echo "sdkmanager not found"
          sdkmanager --list_installed || true

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        working-directory: project
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties

      - name: Make sure wrapper exists
        working-directory: project
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing — downloading Gradle 8.2 directly"
            curl -sL "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build debug APK
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            gradle assembleDebug --no-daemon --stacktrace --info
          fi

      - name: Show APK
        if: always()
        working-directory: project
        run: |
          echo "--- looking for APK ---"
          find . -name "*.apk" -type f 2>/dev/null || echo "no APK found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Get short SHA
        if: success()
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha }}
          name: "Build ${{ steps.vars.outputs.sha }}"
          files: project/app/build/outputs/apk/debug/*.apk
          make_latest: true

      - name: Cleanup old releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[10:] | .[].tagName' | while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
          done
