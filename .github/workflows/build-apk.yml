name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- installed packages ---"
          sdkmanager --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Get short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Read app metadata
        id: meta
        working-directory: project
        run: |
          if [ -f .app-info ]; then
            echo "name=$(cat .app-info)" >> $GITHUB_OUTPUT
          else
            echo "name=app" >> $GITHUB_OUTPUT
          fi

      - name: Verify APK exists
        run: |
          if [ ! -f project/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found — listing output dir:"
            ls -la project/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK size: $(du -h project/app/build/outputs/apk/debug/app-debug.apk)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha }}
          name: "${{ steps.meta.outputs.name }} · ${{ steps.vars.outputs.sha }}"
          files: project/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
          make_latest: true

      - name: Cleanup old releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[10:] | .[].tagName' | while read -r tag; do
            if [ -n "$tag" ]; then
              gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
            fi
          done
